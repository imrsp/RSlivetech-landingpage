<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="RS Live Technologies creates image, signal, and systems for living experiences."
    />
    <title>RS Live Technologies</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header class="site-header" aria-label="Site header">
      <a class="brand" href="#top" aria-label="RS Live Technologies home">
        <span>RS Live Technologies</span>
      </a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="#work">Work</a>
        <a href="#approach">Approach</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main>
      <section class="hero" id="top" aria-labelledby="hero-title">
        <div class="hero-copy">
          <h1 id="hero-title">We make lives.</h1>
          <p>Image, signal, and systems for living experiences.</p>
        </div>
        <figure class="hero-media" aria-label="Atmospheric live technology scene">
          <img
            src="./src/assets/hero-control-room.png"
            alt="Monochrome live production control room with light and haze"
            width="1672"
            height="941"
            loading="eager"
            decoding="async"
          />
        </figure>
        <div class="hero-rail" aria-hidden="true"></div>
      </section>

      <section class="trio-band" id="work" aria-label="Visual rhythm">
        <figure class="card-trio card-trio-left">
          <img
            src="./src/assets/light-studies.png"
            alt="Monochrome stage light studies with beams and haze"
            loading="lazy"
            style="object-position: 50% 18%"
          />
          <figcaption>Light studies</figcaption>
        </figure>
        <figure class="card-trio card-trio-center">
          <img
            src="./src/assets/switcher-hands.png"
            alt="Monochrome close-up of live switching hands at a control desk"
            loading="lazy"
            style="object-position: 52% 50%"
          />
          <figcaption>Signals in motion</figcaption>
        </figure>
        <figure class="card-trio card-trio-right">
          <img
            src="./src/assets/installation-space.png"
            alt="Monochrome installation space with suspended screens and small figures"
            loading="lazy"
            style="object-position: 52% 46%"
          />
          <figcaption>Human scale</figcaption>
        </figure>
      </section>

      <section class="moments" id="approach" aria-labelledby="moments-title">
        <div class="moments-head">
          <h2 id="moments-title">Selected moments</h2>
        </div>
        <div class="moments-grid">
          <figure class="card-selected card-selected-left">
            <img
              src="./src/assets/light-studies.png"
              alt="Monochrome concert-scale light field with a silhouetted figure"
              loading="lazy"
              style="object-position: 48% 26%"
            />
          </figure>
          <figure class="card-selected card-selected-center">
            <img
              src="./src/assets/hero-control-room.png"
              alt="Monochrome live production control room facing a large stage"
              loading="lazy"
              style="object-position: 52% 54%"
            />
          </figure>
          <figure class="card-selected card-selected-right">
            <img
              src="./src/assets/installation-space.png"
              alt="Monochrome installation hall with large vertical screens"
              loading="lazy"
              style="object-position: 56% 46%"
            />
          </figure>
        </div>
      </section>
    </main>

    <footer class="site-footer" id="contact">
      <p>RS Live Technologies</p>
      <a href="mailto:studio@rslivetech.com">studio@rslivetech.com</a>
    </footer>

    <span class="sr-only" id="about">About RS Live Technologies.</span>
  </body>
</html>
